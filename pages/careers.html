<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <title>Careers | Naivik Digital Transformation</title>
  
  <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700,900" />
  <link href="../assets/css/nucleo-icons.css" rel="stylesheet" />
  <link href="../assets/css/nucleo-svg.css" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link id="pagestyle" href="../assets/css/material-kit.css?v=3.1.0" rel="stylesheet" />
  
  <link rel="stylesheet" href="../assets/css/floating-navbar.css">
  <script src="../assets/js/floating-navbar.js"></script>

  <!-- -------- IMPORTING SUPABASE ------- -->  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* --- Naivik Premium Dark Core --- */
    :root {
      --baby-blue: #89CFF0;
      --deep-black: #000000;
      --soft-dark: #121212;
    }

    body { background-color: var(--deep-black); color: #ffffff; }

    /* --- Job Card Styles --- */
    .border-glow-blue {
      border: 1px solid rgba(137, 207, 240, 0.2) !important;
      transition: all 0.3s ease;
      background: var(--soft-dark);
    }

    .border-glow-blue:hover {
      border-color: var(--baby-blue) !important;
      box-shadow: 0 0 20px rgba(137, 207, 240, 0.15);
      transform: translateY(-2px);
    }

    .text-baby-blue { color: var(--baby-blue) !important; }
    .bg-baby-blue { background-color: var(--baby-blue) !important; }

    /* Navigation Adjustment for Dark Mode */
    .navbar-brand.tracking-widest {
      letter-spacing: 0.3rem;
      font-size: 1.2rem;
      font-family: 'Inter', sans-serif;
      color: #fff !important;
    }

    /* Accordion Customization */
    .accordion-button:not(.collapsed) {
      background-color: transparent;
      color: var(--baby-blue);
      box-shadow: none;
    }
    .accordion-button { color: white; background: transparent; }
    .accordion-item { background: transparent; border-color: #333; }

    /* Hero Splatter */
    .bg-splatter {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(137, 207, 240, 0.1) 0%, transparent 70%);
      filter: blur(80px);
      z-index: -1;
    }
    .job-inactive {
        filter: grayscale(0.8) brightness(0.7);
        opacity: 0.7;
        pointer-events: none; /* Disables clicking into the details */
        border: 1px dashed rgba(255, 255, 255, 0.1) !important;
    }

    .status-badge-closed {
        background: rgba(255, 255, 255, 0.1);
        color: #888;
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 50px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
  </style>
</head>

<body class="bg-black">
  <header class="position-relative py-8">
    <div class="bg-splatter" style="top: -10%; left: -5%;"></div>
    <div class="container mt-5">
      <div class="row text-center">
        <div class="col-lg-8 mx-auto">
          <h6 class="text-baby-blue font-weight-bolder text-uppercase tracking-widest mb-3">Join The Mission</h6>
          <h1 class="text-white display-4 font-weight-bolder mb-4">Build the Future of <span class="text-baby-blue">Automation</span></h1>
          <p class="text-muted lead">Help us bridge the gap between legacy systems and AI-powered efficiency.</p>
        </div>
      </div>
    </div>
  </header>

  <section class="py-5 bg-black min-vh-100">
    <div class="container">
      <div class="row">
        
        <div class="col-lg-3">
          <h5 class="text-white mb-4">Filter results:</h5>
          <div class="accordion accordion-flush" id="jobFilters">
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#filterSpec">
                  Specialisation
                </button>
              </h2>
              <div id="filterSpec" class="accordion-collapse collapse show">
                <div class="accordion-body px-0 text-muted">
                  <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="checkOps" checked>
                    <label class="form-check-label" for="checkOps">Operations (1)</label>
                  </div>
                  </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-9">
          <div id="job-container">
            </div>
        </div>

      </div>
    </div>
  </section>

  <footer class="footer py-7 bg-black border-top border-dark">
    <div class="container text-center">
      <h4 class="text-white tracking-widest text-uppercase mb-4">Naivik</h4>
      <p class="text-muted">© <script>document.write(new Date().getFullYear())</script> Naivik Technologies. All rights reserved.</p>
    </div>
  </footer>

  <script>
      const SUPABASE_URL = 'https://duiqfjsogpiadxhdmdqz.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1aXFmanNvZ3BpYWR4aGRtZHF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc2NDM2NDQsImV4cCI6MjA4MzIxOTY0NH0.jyUwREEPhchkWDYX2y7M8WUNkvA94p_J2aiIgoirv8M';
      const nSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      async function loadJobs() {
          const container = document.getElementById('job-container');
          
          // 1. Fetch ALL jobs (Active and Inactive)
          const { data: jobs, error } = await nSupabase
              .from('jobs')
              .select('*')
              .order('is_active', { ascending: false }) // Active jobs stay at the top
              .order('priority', { ascending: false });

          if (error) {
              container.innerHTML = `<p class="text-danger">Error loading positions.</p>`;
              return;
          }

          container.innerHTML = jobs.map(job => {
              const isActive = job.is_active !== false;
              
              return `
                  <div class="card border-glow-blue mb-4 ${!isActive ? 'job-inactive' : 'transition-hover'}">
                      <div class="card-body p-4">
                          <div class="d-flex justify-content-between align-items-start">
                              <div>
                                  <h4 class="${isActive ? 'text-white' : 'text-secondary'} mb-1">${job.title}</h4>
                                  <div class="d-flex gap-3 text-muted small mb-3">
                                      <span><i class="material-symbols-rounded align-bottom fs-6">location_on</i> ${job.location}</span>
                                      <span><i class="material-symbols-rounded align-bottom fs-6">calendar_month</i> ${job.posted}</span>
                                  </div>
                              </div>
                              <div>
                                  ${isActive 
                                      ? '<span class="badge border border-baby-blue text-baby-blue">Open</span>' 
                                      : '<span class="status-badge-closed">Closed</span>'}
                              </div>
                          </div>
                          
                          <p class="text-muted">${job.shortDescription}</p>
                          
                          <div class="d-flex justify-content-between align-items-center mt-4">
                              ${isActive 
                                  ? `<a href="job-details.html?id=${job.id}" class="text-baby-blue fw-bold text-decoration-none">View Position Details →</a>` 
                                  : `<span class="text-secondary small italic">This position is currently not accepting applications.</span>`}
                              
                              <span class="text-xxs text-uppercase tracking-wider text-secondary">Ref: ${job.ref || 'N/A'}</span>
                          </div>
                      </div>
                  </div>
              `;
          }).join('');
      }

      document.addEventListener('DOMContentLoaded', loadJobs);
  </script>

  <script src="../assets/js/core/bootstrap.min.js"></script>
</body>
</html>
